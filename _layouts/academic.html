<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.page_kind != 'home' %}{{ page.title }} · {% endif %}{{ site.data.research.name }}</title>
  <meta name="description" content="{{ site.data.research.name }} is a Ph.D. student at UC Irvine studying video-action models, world-model evaluation, and 3D vision for embodied intelligence.">
  <link rel="canonical" href="{{ site.url }}{{ page.permalink }}">
  <meta property="og:title" content="{{ page.title }} · {{ site.data.research.name }}">
  <meta property="og:description" content="Video-action models, diagnostic benchmarks, and generalizable embodied intelligence.">
  <meta property="og:image" content="{{ site.url }}/images/mengqi_profile.jpg">
  <meta property="og:type" content="website">
  <meta name="theme-color" content="#fcfbf9">
  <link rel="icon" type="image/svg+xml" href="{{ '/assets/images/monogram.svg' | relative_url }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&display=swap" rel="stylesheet">
  <script>try{const t=localStorage.getItem('mengqi-theme');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t;}catch(e){}</script>
  <link rel="stylesheet" href="{{ '/assets/css/academic.css' | relative_url }}">
  <script src="{{ '/assets/js/academic.js' | relative_url }}" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header">
    <div class="wrap header-inner">
      <a class="brand" href="{{ '/' | relative_url }}">{{ site.data.research.name }}</a>
      <nav aria-label="Main navigation">
        <a href="{{ '/' | relative_url }}" {% if page.page_kind == 'home' %}aria-current="page"{% endif %}>Home</a>
        <a href="{{ '/publications/' | relative_url }}" {% if page.page_kind == 'publications' %}aria-current="page"{% endif %}>Publications</a>
        <a href="{{ '/cv/' | relative_url }}" {% if page.page_kind == 'cv' %}aria-current="page"{% endif %}>CV</a>
        <button class="theme-toggle" aria-label="Switch to dark theme" type="button" hidden>
          <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M20.2 14.1A8.5 8.5 0 0 1 9.9 3.8a8.5 8.5 0 1 0 10.3 10.3Z"/></svg>
          <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/></svg>
        </button>
      </nav>
    </div>
  </header>
  <main class="wrap" id="main">{{ content }}</main>
  <footer class="wrap site-footer"><span>© 2026 {{ site.data.research.name }}</span><a href="mailto:{{ site.data.research.email }}">{{ site.data.research.email }}</a></footer>
</body>
</html>
